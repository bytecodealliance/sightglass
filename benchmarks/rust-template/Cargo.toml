[package]
name = "rust-template"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
minijinja = { version = "=2.24.0", default-features = false, features = ["builtins", "macros", "multi_template", "serde"] }
minijinja-contrib = { version = "=2.24.0", features = ["wordcount"] }
serde_json = "=1.0.151"
wit-bindgen = { version = "=0.62.0", default-features = false, features = ["macros"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace]
