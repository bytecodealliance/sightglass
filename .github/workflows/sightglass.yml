name: sightglass

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: info

jobs:
  format-and-clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
    - run: rustup update
    - run: rustup component add rustfmt clippy
    - run: cargo fmt --all -- --check
    - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Wasmtime commit to build for testing.
      REVISION: "239274b0b5e96755a3d3009b7b3659b3b0f6f8cb"
    steps:
    - uses: actions/checkout@v4
    - run: rustup update
    - run: sudo apt install valgrind
      if: runner.os == "Linux"
    - name: Download Cached Wasmtime engine
      uses: actions/cache@v4
      id: wasmtime-cache
      with:
        path: engines/wasmtime/*
        key: wasmtime-${{ runner.os }}-${{ env.REVISION }}

    - name: Build Wasmtime engine
      if: steps.wasmtime-cache.outputs.cache-hit != 'true'
      working-directory: ./engines/wasmtime
      run: |
           rustc build.rs
           ./build --revision "$REVISION"

    - name: Build all
      run: cargo build --verbose --all

    - name: Test all
      run: cargo test --verbose --all
      env:
        RUST_BACKTRACE: 1
